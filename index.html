<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Time Traveler Timeline</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #0b1020;

    color: #f8fafc;
}


/* =========================================================
   HEADER
========================================================= */

header {

    width: 100%;

    padding: 25px 15px;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            #01000b,
            #080614
        );

    border-bottom:
        1px solid #e5e8ec;
}

header h1 {

    margin: 0;

    font-size:
        clamp(
            24px,
            7vw,
            34px
        );

    line-height: 1.2;
}

header p {

    margin: 8px 0 0;

    color: #a45dd3;

    font-size: 14px;

    line-height: 1.5;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 16px;
}


/* =========================================================
   CLOCK
========================================================= */

.clock {

    width: 100%;

    text-align: center;

    padding: 16px 12px;

    margin-bottom: 16px;

    background: #01040c;

    border:
        1px solid #d7d9e0;

    border-radius: 14px;
}

#currentTime {

    font-size:
        clamp(
            17px,
            5vw,
            24px
        );

    font-weight: bold;

    color: #eae9ec;

    line-height: 1.4;
}

#eventCount {

    margin-top: 6px;

    color: #fbfcfe;

    font-size: 15px;
}


/* =========================================================
   PANELS
========================================================= */

.panel {

    width: 100%;

    background: #01050f;

    border:
        1px solid #bbbfc6;

    border-radius: 14px;

    padding: 18px;

    margin-bottom: 16px;
}

.panel h2 {

    margin: 0 0 15px;

    font-size: 20px;
}


/* =========================================================
   FORM
========================================================= */

.form-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

input,
textarea,
select,
button {

    font-family: inherit;

    font-size: 16px;
}

input,
textarea,
select {

    width: 100%;

    min-width: 0;

    padding: 13px;

    border:
        1px solid #4b5563;

    border-radius: 9px;

    background: #1f2937;

    color: white;

    outline: none;
}

input:focus,
textarea:focus,
select:focus {

    border-color: #dedfe6;
}

textarea {

    min-height: 100px;

    resize: vertical;
}

select {

    cursor: pointer;
}

.full {

    grid-column:
        1 / -1;
}


/* =========================================================
   DATE BUILDER
========================================================= */

.date-section {

    grid-column:
        1 / -1;
}

.date-label {

    display: block;

    margin-bottom: 7px;

    color: #aeb4c0;

    font-size: 13px;

    font-weight: bold;
}

.date-builder {

    display: grid;

    grid-template-columns:
        100px
        1fr
        1fr
        100px
        130px;

    gap: 10px;

    width: 100%;
}


/* =========================================================
   BUTTONS
========================================================= */

button {

    min-height: 46px;

    border: none;

    border-radius: 9px;

    padding:
        11px 15px;

    cursor: pointer;

    font-weight: bold;

    touch-action: manipulation;
}

.primary {

    background: #050c58;

    color: rgb(
        224,
        213,
        213
    );
}

.primary:hover {

    background: #4f46e5;
}

.secondary {

    background: #374151;

    color: white;
}

.secondary:hover {

    background: #4b5563;
}

.danger {

    background: #dc2626;

    color: white;
}

.danger:hover {

    background: #b91c1c;
}

.button-row {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 9px;
}

.button-row button {

    width: 100%;

    font-size: 14px;
}


/* =========================================================
   SEARCH + FILTER
========================================================= */

.search-box {

    margin-bottom: 12px;
}

.search-box input {

    font-size: 17px;
}

.filter-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 10px;
}

.filter-item label {

    display: block;

    margin-bottom: 6px;

    color: #9ca3af;

    font-size: 12px;

    font-weight: bold;
}


/* =========================================================
   RESULT BAR
========================================================= */

.result-bar {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;

    margin-top: 14px;

    padding:
        10px 12px;

    border-radius: 8px;

    background: #1f2937;

    color: #9ca3af;

    font-size: 13px;
}

#resultCount {

    color: #c4b5fd;

    font-weight: bold;
}

#totalCount {

    color: #c4b5fd;

    font-weight: bold;
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline {

    position: relative;

    width: 100%;

    margin: 20px 0;

    padding: 5px 0;
}

.timeline::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    bottom: 0;

    width: 3px;

    background: #d1cb18;

    transform:
        translateX(-50%);
}

.timeline-item {

    position: relative;

    width: 50%;

    padding:
        12px 35px;
}

.timeline-item.left {

    left: 0;

    text-align: right;
}

.timeline-item.right {

    left: 50%;

    text-align: left;
}


/* =========================================================
   TIMELINE DOT
========================================================= */

.timeline-dot {

    position: absolute;

    top: 25px;

    width: 17px;

    height: 17px;

    border-radius: 50%;

    background: #f9f9fc;

    border:
        3px solid #f6f7f9;

    z-index: 2;
}

.left .timeline-dot {

    right: -9px;
}

.right .timeline-dot {

    left: -9px;
}


/* =========================================================
   EVENT CARD
========================================================= */

.event-card {

    width: 100%;

    background: #061203;

    border:
        1px solid #374151;

    border-radius: 12px;

    padding: 15px;

    text-align: left;

    box-shadow:
        0 5px 20px
        rgba(
            0,
            0,
            0,
            .2
        );
}

.event-card:hover {

    border-color: #818cf8;
}

.event-card h3 {

    margin:
        0 0 8px;

    color: #ceccd7;

    font-size: 18px;

    line-height: 1.3;

    overflow-wrap:
        anywhere;
}

.event-date {

    font-weight: bold;

    color: #45e748;

    font-size: 14px;

    line-height: 1.5;

    overflow-wrap:
        anywhere;
}

.event-description {

    color: #f4f5f8;

    margin:
        10px 0;

    line-height: 1.5;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;
}

.countdown {

    display: inline-block;

    max-width: 100%;

    margin: 8px 0;

    padding:
        6px 9px;

    background: #08056e;

    border-radius: 6px;

    color: #f4f4f7;

    font-size: 13px;

    overflow-wrap:
        anywhere;
}

.status {

    display: inline-block;

    padding:
        5px 8px;

    border-radius: 6px;

    font-size: 13px;

    font-weight: bold;
}

.past {

    background: #f80606;

    color: #f5f1f1;
}

.future {

    background: #04f0b1;

    color: #010d07;
}

.historical {

    background: #7c3aed;

    color: white;
}


/* =========================================================
   EVENT BUTTONS
========================================================= */

.event-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 12px;
}

.event-buttons button {

    width: 100%;

    min-height: 42px;

    padding: 8px;

    font-size: 13px;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {

    text-align: center;

    color: #9ca3af;

    padding:
        50px 15px;

    font-size: 15px;
}

#fileInput {

    display: none;
}


/* =========================================================
   MOBILE / TABLET
========================================================= */

@media (
    max-width: 800px
) {

    .container {

        padding: 13px;
    }

    .form-grid {

        grid-template-columns:
            1fr;
    }

    .full {

        grid-column: auto;
    }

    .button-row {

        grid-template-columns:
            1fr;
    }

    .filter-grid {

        grid-template-columns:
            1fr;
    }

    .date-builder {

        grid-template-columns:
            1fr 1fr;
    }

    /*
       Mobile timeline
    */

    .timeline::before {

        left: 12px;

        transform: none;
    }

    .timeline-item,
    .timeline-item.left,
    .timeline-item.right {

        width: 100%;

        left: 0;

        padding:
            10px 0 10px 38px;

        text-align: left;
    }

    .timeline-item .timeline-dot,
    .left .timeline-dot,
    .right .timeline-dot {

        left: 4px;

        right: auto;
    }

    .event-card {

        text-align: left;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (
    max-width: 480px
) {

    header {

        padding:
            20px 12px;
    }

    header h1 {

        font-size: 25px;
    }

    header p {

        font-size: 13px;
    }

    .container {

        padding: 9px;
    }

    .panel {

        padding: 13px;

        border-radius: 12px;
    }

    .panel h2 {

        font-size: 18px;
    }

    #currentTime {

        font-size: 16px;
    }

    input,
    textarea,
    select {

        font-size: 16px;

        padding: 12px;
    }

    button {

        min-height: 48px;
    }

    .date-builder {

        grid-template-columns:
            1fr 1fr;
    }

    .timeline {

        margin-top: 12px;
    }

    .timeline::before {

        left: 10px;

        width: 2px;
    }

    .timeline-item,
    .timeline-item.left,
    .timeline-item.right {

        padding-left: 31px;
    }

    .timeline-item .timeline-dot,
    .left .timeline-dot,
    .right .timeline-dot {

        left: 3px;

        width: 15px;

        height: 15px;
    }

    .event-card {

        padding: 13px;
    }

    .event-card h3 {

        font-size: 17px;
    }

    .event-date {

        font-size: 13px;
    }

    .result-bar {

        flex-direction: column;

        align-items:
            flex-start;
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media (
    max-width: 350px
) {

    .container {

        padding: 7px;
    }

    .panel {

        padding: 11px;
    }

    .event-buttons {

        grid-template-columns:
            1fr;
    }

    .date-builder {

        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>
        ⏳ Time Traveler Timeline
    </h1>

    <p>
        Manage events across AD, BC and the future
        <br>
        Enter only as much date information as you know.
    </p>

</header>


<div class="container">


<!-- =====================================================
     CLOCK
===================================================== -->

<div class="clock">

    <div id="currentTime">
        Loading...
    </div>

    <div id="eventCount">
        0 events
    </div>

</div>


<!-- =====================================================
     ADD EVENT
===================================================== -->

<div class="panel">

    <h2>
        ➕ Add Timeline Event
    </h2>


    <div class="form-grid">


        <!-- EVENT TITLE -->

        <input
            id="eventTitle"
            type="text"
            placeholder="Event title"
        >


        <!-- DATE -->

        <div class="date-section">

            <label
                class="date-label"
            >
                📅 Event Date
                <small>
                    (Year required · Month, day and time optional)
                </small>
            </label>


            <div class="date-builder">


                <!-- ERA -->

                <select
                    id="eventEra"
                >

                    <option value="AD">
                        AD
                    </option>

                    <option value="BC">
                        BC
                    </option>

                </select>


                <!-- YEAR -->

                <input
                    id="eventYear"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="Year *"
                >


                <!-- MONTH -->

                <select
                    id="eventMonth"
                >

                    <option value="">
                        Month
                    </option>

                    <option value="1">
                        January
                    </option>

                    <option value="2">
                        February
                    </option>

                    <option value="3">
                        March
                    </option>

                    <option value="4">
                        April
                    </option>

                    <option value="5">
                        May
                    </option>

                    <option value="6">
                        June
                    </option>

                    <option value="7">
                        July
                    </option>

                    <option value="8">
                        August
                    </option>

                    <option value="9">
                        September
                    </option>

                    <option value="10">
                        October
                    </option>

                    <option value="11">
                        November
                    </option>

                    <option value="12">
                        December
                    </option>

                </select>


                <!-- DAY -->

                <input
                    id="eventDay"
                    type="number"
                    min="1"
                    max="31"
                    step="1"
                    placeholder="Day"
                >


                <!-- TIME -->

                <input
                    id="eventTime"
                    type="time"
                >

            </div>

        </div>


        <!-- DESCRIPTION -->

        <textarea
            id="eventDescription"
            class="full"
            placeholder="Description / notes..."
        ></textarea>


        <!-- SAVE -->

        <button
            id="saveEventButton"
            class="primary full"
            onclick="addEvent()"
        >
            ➕ Add Event
        </button>

    </div>

</div>


<!-- =====================================================
     DATA MANAGEMENT
===================================================== -->

<div class="panel">

    <h2>
        💾 Timeline Data
    </h2>

    <div class="button-row">


        <button
            class="primary"
            onclick="downloadData()"
        >
            ⬇️ Download
        </button>


        <button
            class="secondary"
            onclick="openFilePicker()"
        >
            ⬆️ Upload
        </button>


        <button
            class="danger"
            onclick="clearAllEvents()"
        >
            🗑️ Clear
        </button>

    </div>


    <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
        onchange="uploadData(event)"
    >

</div>


<!-- =====================================================
     SEARCH + FILTER
===================================================== -->

<div class="panel">

    <h2>
        🔎 Search & Sort
    </h2>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="Search title, description, AD, BC, year..."
            oninput="displayEvents()"
        >

    </div>


    <!-- FILTERS -->

    <div class="filter-grid">


        <!-- STATUS -->

        <div class="filter-item">

            <label
                for="statusFilter"
            >
                EVENT STATUS
            </label>

            <select
                id="statusFilter"
                onchange="displayEvents()"
            >

                <option value="all">
                    All Events
                </option>

                <option value="past">
                    Past
                </option>

                <option value="future">
                    Future
                </option>

                <option value="historical">
                    BC / Historical
                </option>

            </select>

        </div>


        <!-- SORT -->

        <div class="filter-item">

            <label
                for="sortFilter"
            >
                SORT BY
            </label>

            <select
                id="sortFilter"
                onchange="displayEvents()"
            >

                <option value="dateAsc">
                    Oldest → Newest
                </option>

                <option value="dateDesc">
                    Newest → Oldest
                </option>

                <option value="nameAsc">
                    Name A → Z
                </option>

                <option value="nameDesc">
                    Name Z → A
                </option>

            </select>

        </div>


        <!-- TIME RANGE -->

        <div class="filter-item">

            <label
                for="timeFilter"
            >
                TIME RANGE
            </label>

            <select
                id="timeFilter"
                onchange="displayEvents()"
            >

                <option value="all">
                    All Time
                </option>

                <option value="today">
                    Today
                </option>

                <option value="week">
                    Next 7 Days
                </option>

                <option value="month">
                    Next 30 Days
                </option>

            </select>

        </div>

    </div>


    <!-- RESULT -->

    <div class="result-bar">

        <span>

            Showing:

            <span id="resultCount">
                0
            </span>

            events

        </span>


        <span>

            Total:

            <span id="totalCount">
                0
            </span>

        </span>

    </div>

</div>


<!-- =====================================================
     TIMELINE
===================================================== -->

<div class="panel">

    <h2>
        🕰️ Timeline
    </h2>

    <div
        id="timeline"
        class="timeline"
    ></div>

</div>


</div>


<script>

/* =========================================================
   TIME TRAVELER TIMELINE
========================================================= */


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "timeTravelerTimeline";


let events =
    loadEvents();


let editingEventId =
    null;


/* =========================================================
   LOAD EVENTS
========================================================= */

function loadEvents() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            return [];

        }


        const parsed =
            JSON.parse(saved);


        if (
            !Array.isArray(parsed)
        ) {

            return [];

        }


        /*
           Normalize old and new
           event formats.
        */

        return parsed
            .map(
                normalizeEvent
            )
            .filter(
                event =>
                    event !== null
            );


    }

    catch (error) {

        console.error(
            "Load error:",
            error
        );

        return [];

    }

}


/* =========================================================
   NORMALIZE EVENT
========================================================= */

function normalizeEvent(event) {

    if (
        !event ||
        !event.title
    ) {

        return null;

    }


    /*
       NEW FORMAT
    */

    if (
        event.year &&
        event.era
    ) {

        return {

            id:
                event.id ||
                Date.now() +
                Math.random(),

            title:
                String(
                    event.title
                ),

            era:
                event.era === "BC"
                    ? "BC"
                    : "AD",

            year:
                Number(
                    event.year
                ),

            month:
                event.month
                    ? Number(
                        event.month
                    )
                    : null,

            day:
                event.day
                    ? Number(
                        event.day
                    )
                    : null,

            time:
                event.time ||
                null,

            description:
                String(
                    event.description ||
                    ""
                )

        };

    }


    /*
       OLD FORMAT SUPPORT

       Old events used:

       event.date =
       "2026-08-15T12:00"
    */

    if (event.date) {

        const oldDate =
            new Date(
                event.date
            );


        if (
            !isNaN(
                oldDate.getTime()
            )
        ) {

            return {

                id:
                    event.id ||
                    Date.now() +
                    Math.random(),

                title:
                    String(
                        event.title
                    ),

                era:
                    "AD",

                year:
                    oldDate.getFullYear(),

                month:
                    oldDate.getMonth() + 1,

                day:
                    oldDate.getDate(),

                time:
                    oldDate
                        .toTimeString()
                        .slice(
                            0,
                            5
                        ),

                description:
                    String(
                        event.description ||
                        ""
                    )

            };

        }

    }


    return null;

}


/* =========================================================
   SAVE EVENTS
========================================================= */

function saveEvents() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            events
        )

    );

}


/* =========================================================
   ADD EVENT
========================================================= */

function addEvent() {

    const title =
        document
            .getElementById(
                "eventTitle"
            )
            .value
            .trim();


    const era =
        document
            .getElementById(
                "eventEra"
            )
            .value;


    const year =
        parseInt(

            document
                .getElementById(
                    "eventYear"
                )
                .value,

            10

        );


    const month =
        document
            .getElementById(
                "eventMonth"
            )
            .value;


    const day =
        document
            .getElementById(
                "eventDay"
            )
            .value;


    const time =
        document
            .getElementById(
                "eventTime"
            )
            .value;


    const description =
        document
            .getElementById(
                "eventDescription"
            )
            .value
            .trim();


    if (!title) {

        alert(
            "Please enter an event title."
        );

        return;

    }


    if (
        !year ||
        year < 1
    ) {

        alert(
            "Please enter a valid year."
        );

        return;

    }


    /*
       A day requires a month.
    */

    if (
        day &&
        !month
    ) {

        alert(
            "Please select a month when entering a day."
        );

        return;

    }


    /*
       Validate day.
    */

    if (
        month &&
        day
    ) {

        const maxDay =
            new Date(

                2000,

                Number(month),

                0

            ).getDate();


        if (

            Number(day) < 1 ||

            Number(day) > maxDay

        ) {

            alert(
                "Please enter a valid day."
            );

            return;

        }

    }


    /*
       Create event.
    */

    const newEvent = {

        id:
            Date.now() +
            Math.random(),

        title:
            title,

        era:
            era,

        year:
            year,

        month:
            month
                ? Number(month)
                : null,

        day:
            day
                ? Number(day)
                : null,

        time:
            time ||
            null,

        description:
            description

    };


    events.push(
        newEvent
    );


    saveEvents();

    clearForm();

    displayEvents();

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm() {

    document
        .getElementById(
            "eventTitle"
        )
        .value = "";


    document
        .getElementById(
            "eventEra"
        )
        .value = "AD";


    document
        .getElementById(
            "eventYear"
        )
        .value = "";


    document
        .getElementById(
            "eventMonth"
        )
        .value = "";


    document
        .getElementById(
            "eventDay"
        )
        .value = "";

        events.find(

            title;

        event.era =

        event.year =

/* =========================================================
   ASTRONOMICAL YEAR
=========================================================

   AD 1 = 1
   AD 2 = 2

   BC 1 = 0
   BC 2 = -1
   BC 44 = -43

   Used internally only.
========================================================= */

function astronomicalYear(event) {

    if (
        event.era === "BC"
    ) {

        return (
            1 -
            Number(event.year)
        );

    }


    return Number(
        event.year
    );

}


/* =========================================================
   DATE PRECISION
========================================================= */

function datePrecision(event) {

    /*
       Year only
    */

    if (
        !event.month
    ) {

        return 1;

    }


    /*
       Year + month
    */

    if (
        !event.day
    ) {

        return 2;

    }


    /*
       Complete date
    */

    if (
        !event.time
    ) {

        return 3;

    }


    /*
       Complete date + time
    */

    return 4;

}


/* =========================================================
   HISTORICAL SORT VALUE
========================================================= */

function historicalSortValue(event) {

    const year =
        astronomicalYear(
            event
        );


    const month =
        event.month
            ? Number(
                event.month
            )
            : 1;


    const day =
        event.day
            ? Number(
                event.day
            )
            : 1;


    /*
       Precision is NOT used as
       chronological significance.

       It is only a small tie-breaker.
    */

    return (

        year *
            100000000 +

        month *
            1000000 +

        day *
            1000 +

        datePrecision(
            event
        )

    );

}


/* =========================================================
   FORMAT HISTORICAL DATE
========================================================= */

function formatHistoricalDate(event) {

    let result =
        event.era +
        " " +
        event.year;


    const months = [

        "",
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];


    if (
        event.month
    ) {

        result +=
            ", " +
            months[
                Number(
                    event.month
                )
            ];

    }


    if (
        event.day
    ) {

        result +=
            " " +
            event.day;

    }


    if (
        event.time
    ) {

        result +=
            " · " +
            event.time;

    }


    return result;

}


/* =========================================================
   CAN COUNTDOWN
========================================================= */

function canCountdown(event) {

    return (

        event.era === "AD" &&

        event.month &&

        event.day

    );

}


/* =========================================================
   CONVERT AD EVENT TO JS DATE
========================================================= */

function eventToJSDate(event) {

    if (
        !canCountdown(event)
    ) {

        return null;

    }


    const year =
        Number(
            event.year
        );


    const month =
        Number(
            event.month
        ) - 1;


    const day =
        Number(
            event.day
        );


    const date =
        new Date(0);


    /*
       setFullYear avoids JS's
       special 0-99 year behavior.
    */

    date.setFullYear(

        year,

        month,

        day

    );


    if (
        event.time
    ) {

        const parts =
            event.time
                .split(":");


        date.setHours(

            Number(
                parts[0]
            ),

            Number(
                parts[1]
            ),

            0,

            0

        );

    }

    else {

        date.setHours(

            0,

            0,

            0,

            0

        );

    }


    return date;

}


/* =========================================================
   CURRENT DATE AS EVENT
========================================================= */

function currentDateAsEvent() {

    const now =
        new Date();


    return {

        era:
            "AD",

        year:
            now.getFullYear(),

        month:
            now.getMonth() + 1,

        day:
            now.getDate(),

        time:
            now.toTimeString()
                .slice(
                    0,
                    5
                )

    };

}


/* =========================================================
   EVENT STATUS
========================================================= */

function getEventStatus(event) {

    /*
       BC = historical
    */

    if (
        event.era === "BC"
    ) {

        return "historical";

    }


    /*
       Compare complete AD
       dates normally.
    */

    if (
        canCountdown(event)
    ) {

        return (

            eventToJSDate(event)
            <
            new Date()

        )
            ? "past"
            : "future";

    }


    /*
       Partial AD dates.
       Compare by year/month/day
       where available.
    */

    const eventValue =
        historicalSortValue(
            event
        );


    const nowEvent =
        currentDateAsEvent();


    const nowValue =
        historicalSortValue(
            nowEvent
        );


    return (

        eventValue <
        nowValue

    )
        ? "past"
        : "future";

}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(
    event,
    search
) {

    if (!search) {

        return true;

    }


    const searchableText = [

        event.title,

        event.description,

        formatHistoricalDate(
            event
        ),

        event.era,

        event.year,

        event.month,

        event.day,

        event.time

    ]
        .join(" ")
        .toLowerCase();


    return searchableText.includes(
        search
    );

}


/* =========================================================
   TIME RANGE FILTER
========================================================= */

function matchesTimeRange(
    event,
    filter
) {

    if (
        filter === "all"
    ) {

        return true;

    }


    /*
       Time-range filters require
       complete modern AD dates.
    */

    if (
        !canCountdown(event)
    ) {

        return false;

    }


    const eventDate =
        eventToJSDate(
            event
        );


    const now =
        new Date();


    /*
       TODAY
    */

    if (
        filter === "today"
    ) {

        return (

            eventDate
                .getFullYear()
            ===
            now.getFullYear()

            &&

            eventDate
                .getMonth()
            ===
            now.getMonth()

            &&

            eventDate
                .getDate()
            ===
            now.getDate()

        );

    }


    /*
       NEXT 7 DAYS
    */

    if (
        filter === "week"
    ) {

        const end =
            new Date(
                now
            );


        end.setDate(

            end.getDate()
            +
            7

        );


        return (

            eventDate >= now &&

            eventDate <= end

        );

    }


    /*
       NEXT 30 DAYS
    */

    if (
        filter === "month"
    ) {

        const end =
            new Date(
                now
            );


        end.setDate(

            end.getDate()
            +
            30

        );


        return (

            eventDate >= now &&

            eventDate <= end

        );

    }


    return true;

}


/* =========================================================
   SORT EVENTS
========================================================= */

function sortEvents(
    list,
    sortType
) {

    const sorted =
        [...list];


    if (
        sortType ===
        "dateAsc"
    ) {

        sorted.sort(

            (a, b) =>

                historicalSortValue(a)
                -
                historicalSortValue(b)

        );

    }


    else if (
        sortType ===
        "dateDesc"
    ) {

        sorted.sort(

            (a, b) =>

                historicalSortValue(b)
                -
                historicalSortValue(a)

        );

    }


    else if (
        sortType ===
        "nameAsc"
    ) {

        sorted.sort(

            (a, b) =>

                a.title.localeCompare(

                    b.title,

                    undefined,

                    {
                        sensitivity:
                            "base"
                    }

                )

        );

    }


    else if (
        sortType ===
        "nameDesc"
    ) {

        sorted.sort(

            (a, b) =>

                b.title.localeCompare(

                    a.title,

                    undefined,

                    {
                        sensitivity:
                            "base"
                    }

                )

        );

    }


    return sorted;

}


/* =========================================================
   DISPLAY EVENTS
========================================================= */

function displayEvents() {

    const timeline =
        document.getElementById(
            "timeline"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const statusFilter =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const sortFilter =
        document
            .getElementById(
                "sortFilter"
            )
            .value;


    const timeFilter =
        document
            .getElementById(
                "timeFilter"
            )
            .value;


    /*
       FILTER
    */

    let filtered =
        events.filter(
            event => {

                /*
                   SEARCH
                */

                if (
                    !matchesSearch(
                        event,
                        search
                    )
                ) {

                    return false;

                }


                /*
                   STATUS
                */

                const status =
                    getEventStatus(
                        event
                    );


                if (
                    statusFilter !==
                    "all"
                ) {

                    if (
                        statusFilter !==
                        status
                    ) {

                        return false;

                    }

                }


                /*
                   TIME RANGE
                */

                if (
                    !matchesTimeRange(
                        event,
                        timeFilter
                    )
                ) {

                    return false;

                }


                return true;

            }
        );


    /*
       SORT
    */

    filtered =
        sortEvents(

            filtered,

            sortFilter

        );


    /*
       COUNTERS
    */

    document.getElementById(
        "totalCount"
    ).textContent =
        events.length;


    document.getElementById(
        "resultCount"
    ).textContent =
        filtered.length;


    document.getElementById(
        "eventCount"
    ).textContent =

        events.length +

        (

            events.length === 1

                ? " event"

                : " events"

        );


    /*
       EMPTY
    */

    if (
        filtered.length === 0
    ) {

        timeline.innerHTML = `

            <div class="empty">

                🔎 No events match your
                current search or filters.

                <br><br>

                Try changing the filters
                or search terms.

            </div>

        `;

        return;

    }


    /*
       BUILD TIMELINE
    */

    timeline.innerHTML = "";


    filtered.forEach(

        (event, index) => {


            const status =
                getEventStatus(
                    event
                );


            const side =
                index % 2 === 0

                    ? "left"

                    : "right";


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                `timeline-item ${side}`;


            /*
               Status text
            */

            let statusText;


            if (
                status ===
                "historical"
            ) {

                statusText =
                    "HISTORICAL";

            }

            else if (
                status ===
                "past"
            ) {

                statusText =
                    "PAST";

            }

            else {

                statusText =
                    "FUTURE";

            }


            /*
               Countdown
            */

            const countdown =
                getCountdown(
                    event
                );


            item.innerHTML = `

                <div
                    class="timeline-dot"
                ></div>


                <div
                    class="event-card"
                >


                    <h3>

                        ${escapeHTML(
                            event.title
                        )}

                    </h3>


                    <div
                        class="event-date"
                    >

                        📅

                        ${escapeHTML(
                            formatHistoricalDate(
                                event
                            )
                        )}

                    </div>


                    <br>


                    <span
                        class="status ${status}"
                    >

                        ${statusText}

                    </span>


                    <br>


                    <div
                        class="countdown"
                    >

                        ${escapeHTML(
                            countdown
                        )}

                    </div>


                    ${
                        event.description

                            ? `

                                <div
                                    class="event-description"
                                >

                                    ${escapeHTML(
                                        event.description
                                    )}

                                </div>

                              `

                            : ""

                    }


                    <div
                        class="event-buttons"
                    >


                        <button
                            class="secondary"
                            onclick="editEvent(
                                ${event.id}
                            )"
                        >

                            ✏️ Edit

                        </button>


                        <button
                            class="danger"
                            onclick="deleteEvent(
                                ${event.id}
                            )"
                        >

                            🗑️ Delete

                        </button>


                    </div>


                </div>

            `;


            timeline.appendChild(
                item
            );

        }

    );

}


/* =========================================================
   COUNTDOWN
========================================================= */

function getCountdown(event) {

    /*
       BC events do not get a
       misleading modern countdown.
    */

    if (
        event.era === "BC"
    ) {

        return (
            "🏛️ Historical BC date"
        );

    }


    /*
       Year only
    */

    if (
        !event.month
    ) {

        return (
            "📅 Year only"
        );

    }


    /*
       Month only
    */

    if (
        !event.day
    ) {

        return (
            "📅 Month only"
        );

    }


    /*
       Complete AD date
    */

    const date =
        eventToJSDate(
            event
        );


    if (!date) {

        return (
            "📅 Historical date"
        );

    }


    const now =
        new Date();


    let difference =
        date - now;


    if (
        difference <= 0
    ) {

        difference =
            Math.abs(
                difference
            );


        return (

            "⏱️ " +

            formatDuration(
                difference
            ) +

            " ago"

        );

    }


    return (

        "⏳ " +

        formatDuration(
            difference
        ) +

        " remaining"

    );

}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(
    milliseconds
) {

    let seconds =
        Math.floor(

            milliseconds /
            1000

        );


    const days =
        Math.floor(

            seconds /
            86400

        );


    seconds %=
        86400;


    const hours =
        Math.floor(

            seconds /
            3600

        );


    seconds %=
        3600;


    const minutes =
        Math.floor(

            seconds /
            60

        );


    seconds %=
        60;


    const parts = [];


    if (days) {

        parts.push(
            days + "d"
        );

    }


    if (hours) {

        parts.push(
            hours + "h"
        );

    }


    if (minutes) {

        parts.push(
            minutes + "m"
        );

    }


    if (

        seconds ||

        parts.length === 0

    ) {

        parts.push(
            seconds + "s"
        );

    }


    return parts.join(
        " "
    );

}


/* =========================================================
   DOWNLOAD DATA
========================================================= */

function downloadData() {

    const backup = {

        application:
            "Time Traveler Timeline",

        version:
            2,

        dateFormat:
            "AD/BC flexible date",

        exportedAt:
            new Date()
                .toISOString(),

        events:
            events

    };


    const json =
        JSON.stringify(

            backup,

            null,

            2

        );


    const blob =
        new Blob(

            [json],

            {
                type:
                    "application/json"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const date =
        new Date()
            .toISOString()
            .slice(
                0,
                10
            );


    link.href =
        url;


    link.download =
        `time-traveler-backup-${date}.json`;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}

/* =========================================================
   UPLOAD DATA
========================================================= */

function uploadData(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                let importedEvents;


                /*
                   Backup format
                */

                if (

                    data &&

                    Array.isArray(
                        data.events
                    )

                ) {

                    importedEvents =
                        data.events;

                }


                /*
                   Raw array format
                */

                else if (
                    Array.isArray(
                        data
                    )
                ) {

                    importedEvents =
                        data;

                }


                else {

                    throw new Error(
                        "Invalid timeline file."
                    );

                }


                importedEvents =
                    importedEvents

                        .map(
                            normalizeEvent
                        )

                        .filter(
                            event =>
                                event !== null
                        );


                if (
                    !confirm(

                        `Import ${importedEvents.length} events?`

                    )
                ) {

                    return;

                }


                events =
                    importedEvents;


                saveEvents();

                displayEvents();


                alert(
                    "Timeline imported successfully."
                );


            }

            catch (error) {

                alert(

                    "Could not import file.\n\n" +

                    error.message

                );

            }

        };


    reader.readAsText(
        file
    );


    /*
       Allow the same file
       to be selected again.
    */

    event.target.value = "";

}

    );

}


/* =========================================================
   LIVE CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "currentTime"
    ).textContent =

        now.toLocaleString(

            undefined,

            {

                weekday:
                    "long",

                year:
                    "numeric",

                month:
                    "long",

                day:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"

            }

        );


    /*
       Refresh timeline every second
       so status/countdowns remain
       accurate.
    */

    document
        .querySelectorAll(
            ".countdown"
        )
        .forEach(
            element => {

                /*
                   We rebuild the countdown
                   from the matching event
                   instead of storing dates
                   in the DOM.
                */

            }
        );


    /*
       Re-render every second only
       when there are complete AD
       events. This keeps countdowns
       live.
    */

    if (
        events.some(
            event =>
                canCountdown(
                    event
                )
        )
    ) {

        updateCountdownDisplays();

    }

}


/* =========================================================
   UPDATE COUNTDOWN DISPLAY
========================================================= */

function updateCountdownDisplays() {

    const cards =
        document.querySelectorAll(
            ".event-card"
        );


    cards.forEach(
        card => {

            const title =
                card.querySelector(
                    "h3"
                );


            if (!title) {

                return;

            }


            const event =
                events.find(

                    item =>

                        escapeHTML(
                            item.title
                        ) ===
                        title.innerHTML

                );


            if (!event) {

                return;

            }


            const countdown =
                card.querySelector(
                    ".countdown"
                );


            if (
                countdown
            ) {

                countdown.textContent =
                    getCountdown(
                        event
                    );

            }

        }
    );

}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            text ?? ""
        );


    return div.innerHTML;

}


/* =========================================================
   START APPLICATION
========================================================= */

displayEvents();

updateClock();


setInterval(

    updateClock,

    1000

);

</script>
