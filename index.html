<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time Traveler Timeline</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b1020;
    color: #f8fafc;
}

/* =========================================================
   HEADER
========================================================= */

header {
    width: 100%;
    padding: 25px 15px;
    text-align: center;
    background: linear-gradient(
        135deg,
        #111827,
        #1e1b4b
    );
    border-bottom: 1px solid #374151;
}

header h1 {
    margin: 0;
    font-size: clamp(24px, 7vw, 34px);
    line-height: 1.2;
}

header p {
    margin: 8px 0 0;
    color: #a5b4fc;
    font-size: 14px;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

/* =========================================================
   CLOCK
========================================================= */

.clock {
    width: 100%;
    text-align: center;
    padding: 16px 12px;
    margin-bottom: 16px;
    background: #111827;
    border: 1px solid #374151;
    border-radius: 14px;
}

#currentTime {
    font-size: clamp(17px, 5vw, 24px);
    font-weight: bold;
    color: #c4b5fd;
    line-height: 1.4;
}

#eventCount {
    margin-top: 6px;
    color: #9ca3af;
    font-size: 13px;
}

/* =========================================================
   PANELS
========================================================= */

.panel {
    width: 100%;
    background: #111827;
    border: 1px solid #374151;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
}

.panel h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

/* =========================================================
   FORM
========================================================= */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

input,
textarea,
select,
button {
    font-family: inherit;
    font-size: 16px;
}

input,
textarea,
select {
    width: 100%;
    min-width: 0;
    padding: 13px;
    border: 1px solid #4b5563;
    border-radius: 9px;
    background: #1f2937;
    color: white;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #818cf8;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

select {
    cursor: pointer;
}

.full {
    grid-column: 1 / -1;
}

/* =========================================================
   BUTTONS
========================================================= */

button {
    min-height: 46px;
    border: none;
    border-radius: 9px;
    padding: 11px 15px;
    cursor: pointer;
    font-weight: bold;
    touch-action: manipulation;
}

.primary {
    background: #6366f1;
    color: white;
}

.primary:hover {
    background: #4f46e5;
}

.secondary {
    background: #374151;
    color: white;
}

.secondary:hover {
    background: #4b5563;
}

.danger {
    background: #dc2626;
    color: white;
}

.danger:hover {
    background: #b91c1c;
}

.button-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.button-row button {
    width: 100%;
    font-size: 14px;
}

/* =========================================================
   SEARCH + FILTER
========================================================= */

.search-box {
    margin-bottom: 12px;
}

.search-box input {
    font-size: 17px;
}

.filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
}

.filter-item label {
    display: block;
    margin-bottom: 6px;
    color: #9ca3af;
    font-size: 12px;
    font-weight: bold;
}

/* =========================================================
   RESULT BAR
========================================================= */

.result-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #1f2937;
    color: #9ca3af;
    font-size: 13px;
}

#resultCount {
    color: #c4b5fd;
    font-weight: bold;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline {
    position: relative;
    width: 100%;
    margin: 20px 0;
    padding: 5px 0;
}

/* Central timeline */

.timeline::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #4f46e5;
    transform: translateX(-50%);
}

.timeline-item {
    position: relative;
    width: 50%;
    padding: 12px 35px;
}

.timeline-item.left {
    left: 0;
    text-align: right;
}

.timeline-item.right {
    left: 50%;
    text-align: left;
}

/* =========================================================
   TIMELINE DOT
========================================================= */

.timeline-dot {
    position: absolute;
    top: 25px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #818cf8;
    border: 3px solid #0b1020;
    z-index: 2;
}

.left .timeline-dot {
    right: -9px;
}

.right .timeline-dot {
    left: -9px;
}

/* =========================================================
   EVENT CARD
========================================================= */

.event-card {
    width: 100%;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 15px;
    text-align: left;
    box-shadow: 0 5px 20px rgba(0, 0, 0, .2);
}

.event-card:hover {
    border-color: #6366f1;
}

.event-card h3 {
    margin: 0 0 8px;
    color: #c4b5fd;
    font-size: 18px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.event-date {
    font-weight: bold;
    color: #93c5fd;
    font-size: 14px;
    line-height: 1.5;
}

.event-description {
    color: #d1d5db;
    margin: 10px 0;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.countdown {
    display: inline-block;
    max-width: 100%;
    margin: 8px 0;
    padding: 6px 9px;
    background: #312e81;
    border-radius: 6px;
    color: #ddd6fe;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.status {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
}

.past {
    background: #3f1d1d;
    color: #fca5a5;
}

.upcoming {
    background: #064e3b;
    color: #a7f3d0;
}

/* =========================================================
   EVENT BUTTONS
========================================================= */

.event-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.event-buttons button {
    width: 100%;
    min-height: 42px;
    padding: 8px;
    font-size: 13px;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 50px 15px;
    font-size: 15px;
}

#fileInput {
    display: none;
}

/* =========================================================
   MOBILE / TABLET
========================================================= */

@media (max-width: 800px) {

    .container {
        padding: 13px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .button-row {
        grid-template-columns: 1fr;
    }

    .filter-grid {
        grid-template-columns: 1fr;
    }

    /*
       Convert timeline to one column
    */

    .timeline::before {
        left: 12px;
        transform: none;
    }

    .timeline-item,
    .timeline-item.left,
    .timeline-item.right {
        width: 100%;
        left: 0;
        padding: 10px 0 10px 38px;
        text-align: left;
    }

    .timeline-item .timeline-dot,
    .left .timeline-dot,
    .right .timeline-dot {
        left: 4px;
        right: auto;
    }

    .event-card {
        text-align: left;
    }
}

/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 480px) {

    header {
        padding: 20px 12px;
    }

    header h1 {
        font-size: 25px;
    }

    header p {
        font-size: 13px;
    }

    .container {
        padding: 9px;
    }

    .panel {
        padding: 13px;
        border-radius: 12px;
    }

    .panel h2 {
        font-size: 18px;
    }

    #currentTime {
        font-size: 16px;
    }

    input,
    textarea,
    select {
        font-size: 16px;
        padding: 12px;
    }

    button {
        min-height: 48px;
    }

    .timeline {
        margin-top: 12px;
    }

    .timeline::before {
        left: 10px;
        width: 2px;
    }

    .timeline-item,
    .timeline-item.left,
    .timeline-item.right {
        padding-left: 31px;
    }

    .timeline-item .timeline-dot,
    .left .timeline-dot,
    .right .timeline-dot {
        left: 3px;
        width: 15px;
        height: 15px;
    }

    .event-card {
        padding: 13px;
    }

    .event-card h3 {
        font-size: 17px;
    }

    .event-date {
        font-size: 13px;
    }

    .result-bar {
        flex-direction: column;
        align-items: flex-start;
    }
}

/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media (max-width: 350px) {

    .container {
        padding: 7px;
    }

    .panel {
        padding: 11px;
    }

    .event-buttons {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>⏳ Time Traveler Timeline</h1>

    <p>
        Manage your events across time
    </p>

</header>


<div class="container">


<!-- =====================================================
     CLOCK
===================================================== -->

<div class="clock">

    <div id="currentTime">
        Loading...
    </div>

    <div id="eventCount">
        0 events
    </div>

</div>


<!-- =====================================================
     ADD EVENT
===================================================== -->

<div class="panel">

    <h2>➕ Add Timeline Event</h2>

    <div class="form-grid">

        <input
            id="eventTitle"
            type="text"
            placeholder="Event title"
        >

        <input
            id="eventDate"
            type="datetime-local"
        >

        <textarea
            id="eventDescription"
            class="full"
            placeholder="Description / notes..."
        ></textarea>

        <button
            id="saveEventButton"
            class="primary full"
            onclick="addEvent()"
        >
            ➕ Add Event
        </button>

    </div>

</div>


<!-- =====================================================
     DATA MANAGEMENT
===================================================== -->

<div class="panel">

    <h2>💾 Timeline Data</h2>

    <div class="button-row">

        <button
            class="primary"
            onclick="downloadData()"
        >
            ⬇️ Download
        </button>

        <button
            class="secondary"
            onclick="openFilePicker()"
        >
            ⬆️ Upload
        </button>

        <button
            class="danger"
            onclick="clearAllEvents()"
        >
            🗑️ Clear
        </button>

    </div>

    <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
        onchange="uploadData(event)"
    >

</div>


<!-- =====================================================
     SEARCH + FILTER
===================================================== -->

<div class="panel">

    <h2>🔎 Search & Sort</h2>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="Search title, description, date..."
            oninput="displayEvents()"
        >

    </div>


    <!-- FILTERS -->

    <div class="filter-grid">


        <!-- STATUS FILTER -->

        <div class="filter-item">

            <label for="statusFilter">
                EVENT STATUS
            </label>

            <select
                id="statusFilter"
                onchange="displayEvents()"
            >

                <option value="all">
                    All Events
                </option>

                <option value="upcoming">
                    Upcoming
                </option>

                <option value="past">
                    Past
                </option>

            </select>

        </div>


        <!-- DATE SORT -->

        <div class="filter-item">

            <label for="sortFilter">
                SORT BY
            </label>

            <select
                id="sortFilter"
                onchange="displayEvents()"
            >

                <option value="dateAsc">
                    Oldest → Newest
                </option>

                <option value="dateDesc">
                    Newest → Oldest
                </option>

                <option value="nameAsc">
                    Name A → Z
                </option>

                <option value="nameDesc">
                    Name Z → A
                </option>

            </select>

        </div>


        <!-- QUICK FILTER -->

        <div class="filter-item">

            <label for="timeFilter">
                TIME RANGE
            </label>

            <select
                id="timeFilter"
                onchange="displayEvents()"
            >

                <option value="all">
                    All Time
                </option>

                <option value="today">
                    Today
                </option>

                <option value="week">
                    Next 7 Days
                </option>

                <option value="month">
                    Next 30 Days
                </option>

            </select>

        </div>

    </div>


    <!-- RESULT -->

    <div class="result-bar">

        <span>
            Showing:
            <span id="resultCount">
                0
            </span>
            events
        </span>

        <span>
            Total:
            <span id="totalCount">
                0
            </span>
        </span>

    </div>

</div>


<!-- =====================================================
     TIMELINE
===================================================== -->

<div class="panel">

    <h2>🕰️ Timeline</h2>

    <div
        id="timeline"
        class="timeline"
    ></div>

</div>


</div>


<script>

/* =========================================================
   TIME TRAVELER TIMELINE
========================================================= */


/*
-----------------------------------------------------------
STORAGE
-----------------------------------------------------------
*/

const STORAGE_KEY =
    "timeTravelerTimeline";


let events =
    loadEvents();


let editingEventId =
    null;


/*
-----------------------------------------------------------
LOAD EVENTS
-----------------------------------------------------------
*/

function loadEvents() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            return [];

        }


        const parsed =
            JSON.parse(saved);


        return Array.isArray(parsed)
            ? parsed
            : [];


    } catch (error) {

        console.error(
            "Load error:",
            error
        );


        return [];

    }

}


/*
-----------------------------------------------------------
SAVE TO LOCAL BROWSER
-----------------------------------------------------------
*/

function saveEvents() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(events)
    );

}


/*
-----------------------------------------------------------
ADD EVENT
-----------------------------------------------------------
*/

function addEvent() {

    const title =
        document
            .getElementById("eventTitle")
            .value
            .trim();


    const date =
        document
            .getElementById("eventDate")
            .value;


    const description =
        document
            .getElementById("eventDescription")
            .value
            .trim();


    if (!title || !date) {

        alert(
            "Please enter an event title and date/time."
        );

        return;

    }


    const newEvent = {

        id:
            Date.now() +
            Math.random(),

        title:
            title,

        date:
            date,

        description:
            description

    };


    events.push(
        newEvent
    );


    saveEvents();

    clearForm();

    displayEvents();

}


/*
-----------------------------------------------------------
CLEAR FORM
-----------------------------------------------------------
*/

function clearForm() {

    document
        .getElementById("eventTitle")
        .value = "";


    document
        .getElementById("eventDate")
        .value = "";


    document
        .getElementById("eventDescription")
        .value = "";


}


/*
-----------------------------------------------------------
EDIT EVENT
-----------------------------------------------------------
*/

function editEvent(id) {

    const event =
        events.find(
            item =>
                item.id === id
        );


    if (!event) {

        return;

    }


    document
        .getElementById("eventTitle")
        .value =
        event.title;


    document
        .getElementById("eventDate")
        .value =
        event.date;


    document
        .getElementById("eventDescription")
        .value =
        event.description;


    editingEventId =
        id;


    const button =
        document.getElementById(
            "saveEventButton"
        );


    button.textContent =
        "💾 Save Changes";


    button.onclick =
        saveEditedEvent;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
-----------------------------------------------------------
SAVE EDITED EVENT
-----------------------------------------------------------
*/

function saveEditedEvent() {

    const title =
        document
            .getElementById("eventTitle")
            .value
            .trim();


    const date =
        document
            .getElementById("eventDate")
            .value;


    const description =
        document
            .getElementById("eventDescription")
            .value
            .trim();


    if (!title || !date) {

        alert(
            "Please enter an event title and date/time."
        );

        return;

    }


    const event =
        events.find(
            item =>
                item.id ===
                editingEventId
        );


    if (event) {

        event.title =
            title;

        event.date =
            date;

        event.description =
            description;

    }


    saveEvents();


    editingEventId =
        null;


    clearForm();


    resetAddButton();


    displayEvents();

}


/*
-----------------------------------------------------------
RESET ADD BUTTON
-----------------------------------------------------------
*/

function resetAddButton() {

    const button =
        document.getElementById(
            "saveEventButton"
        );


    button.textContent =
        "➕ Add Event";


    button.onclick =
        addEvent;

}


/*
-----------------------------------------------------------
DELETE EVENT
-----------------------------------------------------------
*/

function deleteEvent(id) {

    if (
        !confirm(
            "Delete this timeline event?"
        )
    ) {

        return;

    }


    events =
        events.filter(
            event =>
                event.id !== id
        );


    saveEvents();


    displayEvents();

}


/*
-----------------------------------------------------------
STATUS CHECK
-----------------------------------------------------------
*/

function isPast(event) {

    return (
        new Date(event.date) <
        new Date()
    );

}


/*
-----------------------------------------------------------
SEARCH TEXT
-----------------------------------------------------------
*/

function matchesSearch(
    event,
    search
) {

    if (!search) {

        return true;

    }


    const searchableText = [

        event.title,

        event.description,

        event.date,

        new Date(
            event.date
        ).toLocaleString()

    ]
        .join(" ")
        .toLowerCase();


    return searchableText.includes(
        search
    );

}


/*
-----------------------------------------------------------
TIME RANGE FILTER
-----------------------------------------------------------
*/

function matchesTimeRange(
    event,
    filter
) {

    if (filter === "all") {

        return true;

    }


    const eventDate =
        new Date(
            event.date
        );


    const now =
        new Date();


    /*
    TODAY
    */

    if (filter === "today") {

        return (
            eventDate.getFullYear() ===
                now.getFullYear()

            &&

            eventDate.getMonth() ===
                now.getMonth()

            &&

            eventDate.getDate() ===
                now.getDate()
        );

    }


    /*
    NEXT 7 DAYS
    */

    if (filter === "week") {

        const end =
            new Date(now);


        end.setDate(
            end.getDate() + 7
        );


        return (
            eventDate >= now &&
            eventDate <= end
        );

    }


    /*
    NEXT 30 DAYS
    */

    if (filter === "month") {

        const end =
            new Date(now);


        end.setDate(
            end.getDate() + 30
        );


        return (
            eventDate >= now &&
            eventDate <= end
        );

    }


    return true;

}


/*
-----------------------------------------------------------
SORT EVENTS
-----------------------------------------------------------
*/

function sortEvents(
    list,
    sortType
) {

    const sorted =
        [...list];


    if (
        sortType ===
        "dateAsc"
    ) {

        sorted.sort(
            (a, b) =>
                new Date(a.date) -
                new Date(b.date)
        );

    }


    else if (
        sortType ===
        "dateDesc"
    ) {

        sorted.sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );

    }


    else if (
        sortType ===
        "nameAsc"
    ) {

        sorted.sort(
            (a, b) =>
                a.title
                    .localeCompare(
                        b.title,
                        undefined,
                        {
                            sensitivity:
                                "base"
                        }
                    )
        );

    }


    else if (
        sortType ===
        "nameDesc"
    ) {

        sorted.sort(
            (a, b) =>
                b.title
                    .localeCompare(
                        a.title,
                        undefined,
                        {
                            sensitivity:
                                "base"
                        }
                    )
        );

    }


    return sorted;

}


/*
-----------------------------------------------------------
DISPLAY EVENTS
-----------------------------------------------------------
*/

function displayEvents() {

    const timeline =
        document.getElementById(
            "timeline"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const statusFilter =
        document.getElementById(
            "statusFilter"
        ).value;


    const sortFilter =
        document.getElementById(
            "sortFilter"
        ).value;


    const timeFilter =
        document.getElementById(
            "timeFilter"
        ).value;


    /*
    -------------------------------------------------------
    FILTER
    -------------------------------------------------------
    */

    let filtered =
        events.filter(
            event => {

                /*
                SEARCH
                */

                if (
                    !matchesSearch(
                        event,
                        search
                    )
                ) {

                    return false;

                }


                /*
                STATUS
                */

                if (
                    statusFilter ===
                    "past"
                ) {

                    if (
                        !isPast(event)
                    ) {

                        return false;

                    }

                }


                if (
                    statusFilter ===
                    "upcoming"
                ) {

                    if (
                        isPast(event)
                    ) {

                        return false;

                    }

                }


                /*
                TIME RANGE
                */

                if (
                    !matchesTimeRange(
                        event,
                        timeFilter
                    )
                ) {

                    return false;

                }


                return true;

            }
        );


    /*
    -------------------------------------------------------
    SORT
    -------------------------------------------------------
    */

    filtered =
        sortEvents(
            filtered,
            sortFilter
        );


    /*
    -------------------------------------------------------
    COUNTERS
    -------------------------------------------------------
    */

    document.getElementById(
        "totalCount"
    ).textContent =
        events.length;


    document.getElementById(
        "resultCount"
    ).textContent =
        filtered.length;


    document.getElementById(
        "eventCount"
    ).textContent =
        events.length +
        (
            events.length === 1
                ? " event"
                : " events"
        );


    /*
    -------------------------------------------------------
    EMPTY
    -------------------------------------------------------
    */

    if (
        filtered.length === 0
    ) {

        timeline.innerHTML = `

            <div class="empty">

                🔎 No events match your
                current search or filters.

                <br><br>

                Try changing the filters
                or search terms.

            </div>

        `;

        return;

    }


    /*
    -------------------------------------------------------
    BUILD TIMELINE
    -------------------------------------------------------
    */

    timeline.innerHTML = "";


    filtered.forEach(
        (event, index) => {

            const eventDate =
                new Date(
                    event.date
                );


            const past =
                eventDate <
                new Date();


            const side =
                index % 2 === 0
                    ? "left"
                    : "right";


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                `timeline-item ${side}`;


            item.innerHTML = `

                <div
                    class="timeline-dot"
                ></div>


                <div
                    class="event-card"
                >

                    <h3>
                        ${escapeHTML(
                            event.title
                        )}
                    </h3>


                    <div
                        class="event-date"
                    >
                        📅
                        ${formatDate(
                            eventDate
                        )}
                    </div>


                    <br>


                    <span
                        class="status ${
                            past
                                ? "past"
                                : "upcoming"
                        }"
                    >

                        ${
                            past
                                ? "PAST"
                                : "UPCOMING"
                        }

                    </span>


                    <br>


                    <div
                        class="countdown"
                        data-date="${
                            event.date
                        }"
                    >

                        ${getCountdown(
                            eventDate
                        )}

                    </div>


                    ${
                        event.description
                            ? `

                        <div
                            class="event-description"
                        >
                            ${escapeHTML(
                                event.description
                            )}
                        </div>

                        `
                            : ""
                    }


                    <div
                        class="event-buttons"
                    >

                        <button
                            class="secondary"
                            onclick="editEvent(
                                ${event.id}
                            )"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="danger"
                            onclick="deleteEvent(
                                ${event.id}
                            )"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>

            `;


            timeline.appendChild(
                item
            );

        }
    );

}


/*
-----------------------------------------------------------
FORMAT DATE
-----------------------------------------------------------
*/

function formatDate(date) {

    return date.toLocaleString(
        undefined,
        {
            year:
                "numeric",

            month:
                "long",

            day:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );

}


/*
-----------------------------------------------------------
COUNTDOWN
-----------------------------------------------------------
*/

function getCountdown(date) {

    const now =
        new Date();


    let difference =
        date - now;


    if (
        difference <= 0
    ) {

        difference =
            Math.abs(
                difference
            );


        return (
            "⏱️ " +
            formatDuration(
                difference
            ) +
            " ago"
        );

    }


    return (
        "⏳ " +
        formatDuration(
            difference
        ) +
        " remaining"
    );

}


/*
-----------------------------------------------------------
FORMAT DURATION
-----------------------------------------------------------
*/

function formatDuration(
    milliseconds
) {

    let seconds =
        Math.floor(
            milliseconds / 1000
        );


    const days =
        Math.floor(
            seconds / 86400
        );


    seconds %=
        86400;


    const hours =
        Math.floor(
            seconds / 3600
        );


    seconds %=
        3600;


    const minutes =
        Math.floor(
            seconds / 60
        );


    seconds %=
        60;


    const parts = [];


    if (days) {

        parts.push(
            days + "d"
        );

    }


    if (hours) {

        parts.push(
            hours + "h"
        );

    }


    if (minutes) {

        parts.push(
            minutes + "m"
        );

    }


    if (
        seconds ||
        parts.length === 0
    ) {

        parts.push(
            seconds + "s"
        );

    }


    return parts.join(" ");

}


/*
-----------------------------------------------------------
DOWNLOAD JSON
-----------------------------------------------------------
*/

function downloadData() {

    const backup = {

        application:
            "Time Traveler Timeline",

        version:
            1,

        exportedAt:
            new Date()
                .toISOString(),

        events:
            events

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const date =
        new Date()
            .toISOString()
            .slice(
                0,
                10
            );


    link.href =
        url;


    link.download =
        `time-traveler-backup-${date}.json`;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}


/*
-----------------------------------------------------------
OPEN FILE PICKER
-----------------------------------------------------------
*/

function openFilePicker() {

    document
        .getElementById(
            "fileInput"
        )
        .click();

}


/*
-----------------------------------------------------------
UPLOAD JSON
-----------------------------------------------------------
*/

function uploadData(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                let importedEvents;


                /*
                Support:

                {
                    events: [...]
                }

                OR

                [...]
                */

                if (
                    data &&
                    Array.isArray(
                        data.events
                    )
                ) {

                    importedEvents =
                        data.events;

                }

                else if (
                    Array.isArray(
                        data
                    )
                ) {

                    importedEvents =
                        data;

                }

                else {

                    throw new Error(
                        "Invalid timeline file."
                    );

                }


                importedEvents =
                    importedEvents.filter(
                        event =>
                            event &&
                            event.title &&
                            event.date
                    );


                if (
                    !confirm(
                        `Import ${importedEvents.length} events?`
                    )
                ) {

                    return;

                }


                events =
                    importedEvents.map(
                        event => ({

                            id:
                                event.id ||
                                Date.now() +
                                Math.random(),

                            title:
                                String(
                                    event.title
                                ),

                            date:
                                String(
                                    event.date
                                ),

                            description:
                                String(
                                    event.description ||
                                    ""
                                )

                        })
                    );


                saveEvents();


                displayEvents();


                alert(
                    "Timeline imported successfully."
                );


            }

            catch (error) {

                alert(
                    "Could not import file.\n\n" +
                    error.message
                );

            }

        };


    reader.readAsText(
        file
    );


    /*
    Allow same file
    to be selected again
    */

    event.target.value = "";

}


/*
-----------------------------------------------------------
CLEAR ALL
-----------------------------------------------------------
*/

function clearAllEvents() {

    if (
        events.length === 0
    ) {

        alert(
            "There are no events to clear."
        );

        return;

    }


    const confirmation =
        confirm(
            "Delete ALL timeline events?\n\nThis cannot be undone unless you have a downloaded backup."
        );


    if (!confirmation) {

        return;

    }


    events = [];


    localStorage.removeItem(
        STORAGE_KEY
    );


    displayEvents();

}


/*
-----------------------------------------------------------
LIVE CLOCK
-----------------------------------------------------------
*/

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "currentTime"
    ).textContent =
        now.toLocaleString(
            undefined,
            {
                weekday:
                    "long",

                year:
                    "numeric",

                month:
                    "long",

                day:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"
            }
        );


    /*
    Update countdowns
    */

    document
        .querySelectorAll(
            ".countdown"
        )
        .forEach(
            element => {

                const date =
                    new Date(
                        element.dataset.date
                    );


                element.textContent =
                    getCountdown(
                        date
                    );

            }
        );

}


/*
-----------------------------------------------------------
HTML ESCAPING
-----------------------------------------------------------
*/

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/*
-----------------------------------------------------------
START
-----------------------------------------------------------
*/

displayEvents();

updateClock();


setInterval(
    updateClock,
    1000
);

</script>
